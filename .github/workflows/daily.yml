name: Daily update

on:
  schedule:
    - cron: "30 7 * * *"   # Daily refresh from Portuguese and European official sources
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["academic_offers/**", "templates/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write   # commit the updated database
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Scrape and build
        env:
          # Optional. Without it, notices whose posts are only in a PDF annex stay as one "see notice" entry.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATALAYA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m academic_offers

      - name: Commit database
        run: |
          git config user.name "atalaya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.db
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push

      # GitHub's Pages API cannot be enabled by every repository token.
      # Keep the daily data pipeline green when the owner has not completed
      # the one-time Settings → Pages setup; publish automatically afterwards.
      - name: Check whether GitHub Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages.json --write-out "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ] || [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled or is not accessible to this workflow. Scraping and database updates succeeded; enable Settings → Pages → Build and deployment → GitHub Actions to publish the site."
          else
            cat /tmp/pages.json
            echo "GitHub Pages availability check failed with HTTP $status" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
