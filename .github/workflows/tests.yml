name: Tests

on:
  push:
    branches: [main]
    paths:
      - "academic_offers/**"
      - "tests/**"
      - "templates/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "academic_offers/**"
      - "tests/**"
      - "templates/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend behavior tests
        run: node tests/test_frontend.js
